# /etc/apache2/sites-available/pachimind.conf
# PachiMind — pachimind.rail.ar
# Requiere: mod_proxy mod_proxy_http mod_ssl mod_headers mod_rewrite

<VirtualHost *:80>
    ServerName pachimind.rail.ar
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName pachimind.rail.ar

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/pachimind.rail.ar/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pachimind.rail.ar/privkey.pem
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    Header always set X-Frame-Options           "DENY"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # External clients use their own scoped X-API-Key. Never inject credentials.
    ProxyPass        /api/v1/ http://127.0.0.1:8000/
    ProxyPassReverse /api/v1/ http://127.0.0.1:8000/

    # This route is server-to-server over loopback, never public.
    <Location "/api/ai/chat/internal">
        Require all denied
    </Location>

    # Browser and legacy API routes go through Node's authenticated gateway below.

    # ── WebSocket (Vite HMR en dev, ws en prod) ───────────────────────
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade  [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3000/$1 [P,L]

    # ── Node.js :3000 (frontend + gateway autenticado + rutas /api/ai) ───────────────
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  /var/log/apache2/pachimind_error.log
    CustomLog /var/log/apache2/pachimind_access.log combined
</VirtualHost>
